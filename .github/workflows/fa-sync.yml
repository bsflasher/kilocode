# Kilo Code (Persian fork) — sync with upstream and auto-translate new strings.
#
# Runs on a schedule (and on demand). It:
#   1. Merges the latest upstream/main into this fork's main.
#   2. Regenerates the Persian (fa) i18n files, translating only NEW/CHANGED
#      English strings via an OpenAI-compatible LLM (see scripts/fa-i18n).
#   3. Verifies typecheck + i18n tests still pass.
#   4. Commits and pushes the updated fa.ts files.
#
# If the upstream merge conflicts, the job stops and opens an issue so a human
# can resolve it. Translation itself never blocks the build: any string the LLM
# fails to translate keeps its English value as a safe fallback.
#
# Required repository secret:
#   FA_LLM_API_KEY   API key for the translation model (OpenAI-compatible)
# Optional repository variables:
#   FA_LLM_BASE_URL  default https://api.openai.com/v1
#   FA_LLM_MODEL     default gpt-4o-mini

name: fa-sync

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate ALL strings (not just new ones)"
        type: boolean
        default: false

concurrency:
  group: fa-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "fa-sync bot"
          git config user.email "fa-sync@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/Kilo-Org/kilocode.git || true
          git fetch upstream main

      - name: Merge upstream/main
        id: merge
        run: |
          set +e
          git merge --no-edit upstream/main
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "fa-sync: upstream merge conflict needs manual resolution",
              body: "The automatic merge of `upstream/main` into `main` conflicted. "
                + "Please merge manually, then run the `fa-sync` workflow again.",
            })

      - name: Stop if conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "Upstream merge conflicted; stopping. See the opened issue."
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Translate new Persian strings
        working-directory: packages/kilo-vscode
        env:
          FA_LLM_API_KEY: ${{ secrets.FA_LLM_API_KEY }}
          FA_LLM_BASE_URL: ${{ vars.FA_LLM_BASE_URL }}
          FA_LLM_MODEL: ${{ vars.FA_LLM_MODEL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            bun scripts/fa-i18n/generate.ts --force
          else
            bun scripts/fa-i18n/generate.ts
          fi

      - name: Verify typecheck and i18n tests
        working-directory: packages/kilo-vscode
        run: |
          bun run typecheck
          bun test tests/unit/i18n-keys.test.ts tests/unit/agent-manager-i18n-split.test.ts tests/unit/language-utils.test.ts

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(i18n): sync upstream and refresh Persian translations"
          git push origin HEAD:main
